name: Rotacion Diaria Assetto Corsa

on:
  schedule:
    # 12:50 PM de Argentina son las 15:50 UTC (-3 horas). 
    # Ponemos 50 14 para que arranque a las 11:50 AM (o 50 15 para las 12:50 PM). 
    # Si querés que sea exactamente a las 11:50 AM de Argentina para que a las 12:00 esté listo:
    - cron: '50 14 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías necesarias
        run: |
          pip install discord.py paramiko pytz

      - name: Ejecutar el Bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CANAL_AVISOS_ID: ${{ secrets.CANAL_AVISOS_ID }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          python bot.py
